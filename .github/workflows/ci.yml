---
name: CI

on:
  workflow_dispatch:
  push:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      # the code only builds for Windows (go-winio named pipes)
      GOOS: windows
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: src

  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: linux/Dockerfile
          platforms: linux/amd64,linux/arm64/8
          push: false
          tags: gesellix/npipe:ci-linux

  build-windows:
    name: Build (Windows)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Docker Build
        run: |
          docker build -f windows/Dockerfile -t gesellix/npipe:ci-windows .
...
